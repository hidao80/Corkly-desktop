name: CI

permissions: {}

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - uses: ./.github/actions/setup
      - run: bun run fmt:check
      - run: bun run lint
      - uses: actions/cache@v7
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test

  build:
    strategy:
      # Don't cancel the other OSes when one fails — a single-platform issue
      # shouldn't hide the state of the others.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - uses: ./.github/actions/setup
      # Tauri v2 on Linux needs webkit2gtk-4.1 + gtk-3 + rsvg2 + patchelf.
      # macOS / Windows have no comparable prerequisite (WebView2 is bundled on
      # Windows 10 1803+, WebKit is a system framework on macOS).
      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - run: bun run tauri build --no-bundle
